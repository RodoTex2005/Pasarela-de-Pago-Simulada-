<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Pasarela Demo</title><link rel="stylesheet" href="assets/css/styles.css"><style>.auth-card{max-width:460px;margin:3rem auto;padding:1.5rem;border:1px solid #ddd;border-radius:16px}.auth-card .field{margin:1rem 0}.auth-card input{width:100%;padding:.8rem}.auth-card a{color:inherit}</style></head><body><header class="top"><a class="brand" href="store.html">Pasarela Demo</a><a href="register.html">Crear cuenta</a></header><main class="auth-card"><h1>Bienvenido de nuevo</h1><p>Inicia sesión para completar tu compra.</p><form id="authForm"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><p id="message" role="alert"></p><button class="btn btn-primary" type="submit" id="submitBtn">Iniciar sesión</button></form><p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p><p><a href="store.html">Volver a la tienda</a></p></main><script src="assets/js/auth.js"></script></body></html>
