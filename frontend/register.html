<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | Pasarela Demo</title><link rel="stylesheet" href="assets/css/styles.css"><style>.auth-card{max-width:460px;margin:3rem auto;padding:1.5rem;border:1px solid #ddd;border-radius:16px}.auth-card .field{margin:1rem 0}.auth-card input{width:100%;padding:.8rem}.auth-card a{color:inherit}</style></head><body><header class="top"><a class="brand" href="store.html">Pasarela Demo</a><a href="login.html">Iniciar sesión</a></header><main class="auth-card"><h1>Crea tu cuenta</h1><p>Tu cuenta te permitirá continuar al checkout.</p><form id="authForm"><div class="field"><label for="name">Nombre</label><input id="name" autocomplete="name" required minlength="3" maxlength="120"></div><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">Contraseña (mínimo 10 caracteres)</label><input id="password" type="password" autocomplete="new-password" required minlength="10" maxlength="72"></div><p id="message" role="alert"></p><button class="btn btn-primary" type="submit" id="submitBtn">Crear cuenta</button></form><p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p></main><script src="assets/js/auth.js"></script></body></html>
